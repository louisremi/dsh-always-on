name: Release notes

# Fills an empty release description with GitHub's automatically generated
# release notes (everything merged since the previous release). The repo
# lands changes as pull requests so the generator has content to work with;
# `.github/release.yml` controls the categorization.
# `created` covers releases published right away; `published` covers drafts,
# which Actions does not trigger `created` for.

on:
  release:
    types: [created, published]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    # A non-draft release fires both triggers at once; run them one at a
    # time so the second one sees the description the first one wrote.
    concurrency:
      group: release-notes-${{ github.event.release.tag_name }}
      cancel-in-progress: false
    steps:
      - name: Generate the release description
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [ -n "$body" ]; then
            echo "Release already has a description; leaving it as is."
            exit 0
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes
